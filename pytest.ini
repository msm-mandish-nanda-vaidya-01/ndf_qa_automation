[pytest]
testpaths = lib/app
python_files = orchestrator.py be.py fe.py *_checks.py test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    -p lib.core.fixtures.conftest
    --strict-markers
    --strict-config
    --timeout=300
; Allure reporting is off for now (features.allure_enabled: false in settings.yaml).
; --alluredir is what activates allure-pytest and makes it write reports/allure-results;
; restore this line together with that flag to turn reporting back on.
;   --alluredir=reports/allure-results
    --html=reports/pytest-report.html
    --self-contained-html

markers =
    e2e: full cross-module end-to-end flow
    critical_path: smoke-level critical path, must pass before any deploy
    module: single-module flow (etl/gdb, purchase_checker/login, ...)
    be: backend action layer
    fe: frontend validation layer
    db: persisted-state verification (postgres/mongo/opensearch/s3)
    postgres: touches postgres
    mongo: touches mongodb
    opensearch: touches opensearch
    s3: touches s3
    slow: long-running, excluded from PR runs

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)-8s %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

filterwarnings =
    error::DeprecationWarning:lib.*
