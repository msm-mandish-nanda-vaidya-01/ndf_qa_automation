# Non-secret configuration only: URLs, timeouts, feature flags.
# Credentials, tokens and hosts-with-credentials belong in .env.<env> / CI secrets.
# Frontend URL is per-subsidiary and secret-file-scoped -> FE_URL_<SUBSIDIARY> in
# .env.<env>, not here (subsidiaries log into separate country domains).
#
# `defaults` is deep-merged with the selected environment block.
# Environment keys must match the .env.<env> file names: dev, stg, prod.

defaults:
  # Canonical subsidiary list. Add new subsidiaries here only — never hardcode a
  # subsidiary list elsewhere (CLI, module code, etc).
  subsidiaries: [MJP, KOR, USA]

  timeouts:
    page_load: 15
    element: 15
    api_request: 30
    db_query: 20
    # how long persisted state may lag behind the BE action
    eventual_consistency: 60
    opensearch_index_refresh: 10

  retries:
    api: 2
    eventual_consistency_poll_interval: 2

  features:
    fe_headless: false
    fe_screenshot_on_failure: true
    fe_trace_on_failure: true
    verify_s3: true
    verify_opensearch: true
    strict_db_row_count: false
    # Master switch for every Allure artifact: run metadata, per-test attachments and the
    # generated HTML site. Currently OFF — the reporting code is kept intact and a run
    # simply writes no allure files. Flip to true (and restore --alluredir in pytest.ini,
    # which is what makes allure-pytest write raw results at all) to turn reporting back on.
    allure_enabled: false
    # Render reports/allure-results into an HTML site at the end of every pytest session.
    # Subordinate to allure_enabled — ignored while that is false. Needs the external
    # `allure` commandline; when it's absent the run still passes and logs a WARNING with
    # the manual command. Set false to skip the attempt entirely.
    auto_generate_allure_report: true

  browser:
    name: chromium
    viewport: { width: 1920, height: 1080 }
    slow_mo_ms: 0

environments:
  dev:
    urls:
      be_base: https://api-dev.example.internal
      be_etl: https://api-dev.example.internal/etl
      be_purchase_checker: https://api-dev.example.internal/purchase-checker
    # Next.js server-action ids for the apps under test, read via Config.next_action().
    # Not secret, but build-coupled: every deploy of the target app regenerates these,
    # so a sudden 404/400 from a be.py server-action call means re-capture the id from
    # the browser's network tab rather than a code bug.
    next_actions:
      purchase_checker_login: e4e2d05fb6115be3d8d3d511e435a654f864daad
    features:
      strict_db_row_count: false

  stg:
    urls:
      be_base: https://api-stg.example.internal
      be_etl: https://api-stg.example.internal/etl
      be_purchase_checker: https://api-stg.example.internal/purchase-checker
    timeouts:
      eventual_consistency: 120
    features:
      fe_headless: true
      strict_db_row_count: true

  # Full be->fe->db flow runs here too — prod is not read-only.
  prod:
    urls:
      be_base: https://api.example.internal
      be_etl: https://api.example.internal/etl
      be_purchase_checker: https://api.example.internal/purchase-checker
    timeouts:
      eventual_consistency: 180
    features:
      fe_headless: true
      strict_db_row_count: true
